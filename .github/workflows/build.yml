name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build with Buildozer
        uses: snipsco/buildozer-action@v1
        env:
          TITLE: "Free Pro Photo Editor"
          PACKAGE_NAME: "freeprophotoeditor"
        with:
          args: android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v2
        with:
          name: package
          path: bin/*.apk
          
